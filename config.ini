# LOC Fixer settings. Delete a line to use the default.
# After changing anything here, the plugin rebuilds on the next start.

# Skip a localizer if its course differs from the scenery runway by more (degrees).
max_angle = 1.0
# Skip if the LOC, or where its beam crosses the threshold, is further than
# this from the scenery centerline (metres). Bigger usually means the scenery
# runway itself is misplaced.
max_offset = 100
# Fixes bigger than this (metres) are marked fixed_review in report.csv.
review_offset = 30
# Skip if the LOC is further than this past the far runway end (metres).
max_beyond = 2500
# Leave alone if already within this many metres.
min_fix = 0.5
# Approach types that are deliberately not aligned with the runway.
skip_types = LDA, SDF, IGS
